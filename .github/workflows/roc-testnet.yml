name: ROC-Testnet
on:
    workflow_dispatch:
        inputs:
            bump_type:
                description: 'Version bump type (auto = detect from commits)'
                required: false
                default: 'auto'
                type: choice
                options:
                    - auto
                    - patch
                    - minor
                    - major

permissions: {}

jobs:
    bump_version:
        name: Bump Version
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        outputs:
            new_tag: ${{ steps.bump_version_step.outputs.new_tag }}
            changelog: ${{ steps.bump_version_step.outputs.changelog }}
        steps:
            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  fetch-depth: 0

            - name: Bump version and push tag
              id: bump_version_step
              env:
                  BUMP_TYPE: ${{ inputs.bump_type || 'auto' }}
              run: |
                  git fetch --tags

                  LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
                  [ -z "$LATEST_TAG" ] && LATEST_TAG="v0.0.0"
                  echo "Latest tag: $LATEST_TAG"

                  MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | tr -d 'v')
                  MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
                  PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)

                  COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%B" 2>/dev/null || echo "")

                  BUMP="$BUMP_TYPE"
                  if [ "$BUMP" = "auto" ]; then
                    if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|!:)"; then
                      BUMP="major"
                    elif echo "$COMMITS" | grep -qE "^feat(\([^)]*\))?:"; then
                      BUMP="minor"
                    else
                      BUMP="patch"
                    fi
                  fi
                  echo "Bump type: $BUMP"

                  case "$BUMP" in
                    major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                    minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                    patch) PATCH=$((PATCH + 1)) ;;
                  esac

                  NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
                  echo "New tag: $NEW_TAG"

                  CHANGELOG=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Initial release")

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "$NEW_TAG"
                  git push origin "$NEW_TAG"

                  echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
                  {
                    echo "changelog<<CHANGELOG_EOF"
                    echo "$CHANGELOG"
                    echo "CHANGELOG_EOF"
                  } >> "$GITHUB_OUTPUT"

    create_release:
        name: Create Release
        runs-on: ubuntu-22.04
        needs: bump_version
        if: ${{ needs.bump_version.outputs.new_tag != null }}
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

            - name: setup Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 22.23.1
                  registry-url: "https://npm.pkg.github.com"

            - name: Install setup
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Build
              run: npm run build:roc-testnet

            - name: Pin to IPFS
              id: upload
              uses: anantaramdas/ipfs-pinata-deploy-action@39bbda1ce1fe24c69c6f57861b8038278d53688d
              with:
                  pin-name: ROC Testnet ${{ needs.bump_version.outputs.new_tag }}
                  path: "./dist"
                  pinata-api-key: ${{ secrets.PINATA_API_KEY_ROC }}
                  pinata-secret-api-key: ${{ secrets.PINATA_API_SECRET_KEY_ROC }}

            - name: Convert CIDv0 to CIDv1
              id: convert_cidv0
              uses: money-on-chain/convert-cidv0-cidv1@v1.0.0
              with:
                  cidv0: ${{ steps.upload.outputs.hash }}

            - name: Update Cloudflare Worker KV
              run: |
                  curl --fail -X PUT \
                    "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID_ROC_TESTNET }}/values/current_cid" \
                    -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                    -H "Content-Type: text/plain" \
                    --data "${{ steps.upload.outputs.hash }}"

            - name: Create GitHub Release
              id: create_release
              uses: actions/create-release@v1.1.0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  tag_name: ${{ needs.bump_version.outputs.new_tag }}
                  release_name: ROC Testnet ${{ needs.bump_version.outputs.new_tag }}
                  prerelease: true
                  body: |
                      **IMPORTANT:** This is a pre-release!, please use at your own RISK... is for testing purpose!

                      - CIDv0: `${{ steps.upload.outputs.hash }}`
                      - CIDv1: `${{ steps.convert_cidv0.outputs.cidv1 }}`

                      **Primary Testnet gateway**:
                      - [https://dapp-testnet.rifonchain.com/](https://dapp-testnet.rifonchain.com/).

                      **Alternative Testnet gateways**:
                      - https://rifonchain.mypinata.cloud/ipfs/${{ steps.upload.outputs.hash }}
                      - https://cloudflare-ipfs.com/ipfs/${{ steps.upload.outputs.hash }}

                      ${{ needs.bump_version.outputs.changelog }}
