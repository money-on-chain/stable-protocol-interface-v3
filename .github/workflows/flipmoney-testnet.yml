name: Flipmoney-Testnet
on:
    workflow_dispatch:
        inputs:
            bump_type:
                description: 'Version bump type (auto = detect from commits)'
                required: false
                default: 'auto'
                type: choice
                options:
                    - auto
                    - patch
                    - minor
                    - major

permissions: {}

concurrency:
    group: version-bump
    cancel-in-progress: false

jobs:
    bump_version:
        name: Bump Version
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        outputs:
            new_tag: ${{ steps.bump_version_step.outputs.new_tag }}
            changelog: ${{ steps.bump_version_step.outputs.changelog }}
        steps:
            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  fetch-depth: 0

            - name: Bump version and push tag
              id: bump_version_step
              env:
                  BUMP_TYPE: ${{ inputs.bump_type || 'auto' }}
              run: |
                  set -e

                  # Only allow releases from master or develop
                  if [ "$GITHUB_REF_NAME" != "master" ] && [ "$GITHUB_REF_NAME" != "develop" ]; then
                    echo "::error::Releases can only be triggered from 'master' or 'develop' (current: $GITHUB_REF_NAME)"
                    exit 1
                  fi

                  LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

                  if [ -z "$LATEST_TAG" ]; then
                    MAJOR=0; MINOR=0; PATCH=0
                    LOG_RANGE="HEAD"
                    echo "Latest tag: none (first release)"
                  else
                    echo "Latest tag: $LATEST_TAG"
                    IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
                    LOG_RANGE="${LATEST_TAG}..HEAD"
                  fi

                  if [ -z "$(git log "$LOG_RANGE" --oneline)" ]; then
                    echo "No commits since ${LATEST_TAG:-the beginning}. Nothing to release."
                    exit 0
                  fi

                  BUMP="$BUMP_TYPE"
                  if [ "$BUMP" = "auto" ]; then
                    FULL_MESSAGES=$(git log "$LOG_RANGE" --pretty=format:"%B")
                    SUBJECTS=$(git log "$LOG_RANGE" --pretty=format:"%s")
                    if echo "$FULL_MESSAGES" | grep -qE "^BREAKING CHANGE:" || \
                       echo "$SUBJECTS" | grep -qE "^[a-z]+(\([^)]*\))?!:"; then
                      BUMP="major"
                    elif echo "$SUBJECTS" | grep -qE "^feat(\([^)]*\))?:"; then
                      BUMP="minor"
                    else
                      BUMP="patch"
                    fi
                  fi
                  echo "Bump type: $BUMP"

                  case "$BUMP" in
                    major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                    minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                    patch) PATCH=$((PATCH + 1)) ;;
                    *) echo "::error::Unknown bump_type '$BUMP' — must be auto, patch, minor, or major"; exit 1 ;;
                  esac

                  NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
                  echo "New tag: $NEW_TAG"

                  CHANGELOG=$(git log "$LOG_RANGE" --pretty=format:"- %s (%h)")

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "$NEW_TAG"
                  git push origin "$NEW_TAG"

                  echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
                  EOF_DELIM="CHANGELOG_$(openssl rand -hex 8)"
                  {
                    echo "changelog<<$EOF_DELIM"
                    echo "$CHANGELOG"
                    echo "$EOF_DELIM"
                  } >> "$GITHUB_OUTPUT"

    create_release:
        name: Create Release
        runs-on: ubuntu-22.04
        needs: bump_version
        if: ${{ needs.bump_version.result == 'success' && needs.bump_version.outputs.new_tag != '' }}
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

            - name: setup Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 22.23.1
                  registry-url: "https://npm.pkg.github.com"

            - name: Install setup
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Build
              run: npm run build:flipmoney-testnet

            - name: Pin to IPFS
              id: upload
              uses: anantaramdas/ipfs-pinata-deploy-action@39bbda1ce1fe24c69c6f57861b8038278d53688d
              with:
                  pin-name: Flipmoney Testnet ${{ needs.bump_version.outputs.new_tag }}
                  path: "./dist"
                  pinata-api-key: ${{ secrets.PINATA_API_KEY }}
                  pinata-secret-api-key: ${{ secrets.PINATA_API_SECRET_KEY }}

            - name: Convert CIDv0 to CIDv1
              id: convert_cidv0
              uses: money-on-chain/convert-cidv0-cidv1@v1.0.0
              with:
                  cidv0: ${{ steps.upload.outputs.hash }}

            - name: Update Cloudflare Worker KV
              run: |
                  curl --fail -X PUT \
                    "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID_FLIPMONEY_TESTNET }}/values/current_cid" \
                    -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                    -H "Content-Type: text/plain" \
                    --data "${{ steps.upload.outputs.hash }}"

            - name: Create GitHub Release
              id: create_release
              uses: actions/create-release@v1.1.0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  tag_name: ${{ needs.bump_version.outputs.new_tag }}
                  release_name: Flipmoney Testnet ${{ needs.bump_version.outputs.new_tag }}
                  prerelease: true
                  body: |
                      **IMPORTANT:** This is a pre-release!, please use at your own RISK... is for testing purpose!

                      - CIDv0: `${{ steps.upload.outputs.hash }}`
                      - CIDv1: `${{ steps.convert_cidv0.outputs.cidv1 }}`

                      **Primary Testnet gateways**:
                      - https://dapp.flipmoney.io/ipfs/${{ steps.upload.outputs.hash }}

                      **Alternative Testnet gateways**:
                      - https://flipmoney.mypinata.cloud/ipfs/${{ steps.upload.outputs.hash }}
                      - https://cloudflare-ipfs.com/ipfs/${{ steps.upload.outputs.hash }}

                      ${{ needs.bump_version.outputs.changelog }}
