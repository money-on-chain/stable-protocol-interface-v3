name = "dapp-proxy"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Deploy steps (run once from your machine with `wrangler login` first):
#
# 1. Create a KV namespace for each domain:
#      wrangler kv namespace create DAPP_KV --env roc
#      wrangler kv namespace create DAPP_KV --env flipmoney
#      wrangler kv namespace create DAPP_KV --env moc
#      wrangler kv namespace create DAPP_KV --env roc-testnet
#      wrangler kv namespace create DAPP_KV --env flipmoney-testnet
#      wrangler kv namespace create DAPP_KV --env moc-testnet
#    Copy the `id` values printed by each command into the placeholders below.
#
# 2. Deploy each worker:
#      wrangler deploy --env roc
#      wrangler deploy --env flipmoney
#      wrangler deploy --env moc
#      wrangler deploy --env roc-testnet
#      wrangler deploy --env flipmoney-testnet
#      wrangler deploy --env moc-testnet
#
# 3. In Cloudflare dashboard → Workers & Pages → each worker → Settings → Triggers,
#    confirm the route is active. The DNS CNAME to Pinata can stay as-is;
#    the Worker route intercepts requests before they reach the origin.
#
# GitHub Actions secrets required (Settings → Secrets → Actions):
#   CF_ACCOUNT_ID                       — Cloudflare account ID (same for all workflows)
#   CF_API_TOKEN                        — API token with "Workers KV Storage:Edit" permission
#   CF_KV_NAMESPACE_ID_ROC              — id of the KV namespace created for the roc env
#   CF_KV_NAMESPACE_ID_FLIPMONEY        — id of the KV namespace created for the flipmoney env
#   CF_KV_NAMESPACE_ID_MOC              — id of the KV namespace created for the moc env
#   CF_KV_NAMESPACE_ID_ROC_TESTNET      — id of the KV namespace created for the roc-testnet env
#   CF_KV_NAMESPACE_ID_FLIPMONEY_TESTNET — id of the KV namespace created for the flipmoney-testnet env
#   CF_KV_NAMESPACE_ID_MOC_TESTNET      — id of the KV namespace created for the moc-testnet env

# MIGRATION (moc-v1: manage.moneyonchain.com -> dapp.moneyonchain.com).
# The legacy dapp (stable-protocol-interface repo) moved to dapp-classic.*
# but its worker still owns dapp.moneyonchain.com / dapp-testnet.* routes.
# Cutover, testnet first (dapp-testnet / env moc-testnet), then mainnet:
#   1. Remove the dapp.* route from the legacy worker's wrangler.toml and
#      `wrangler deploy` it (in that repo).
#   2. Here, uncomment the CUTOVER blocks of the env (new route +
#      CANONICAL_HOST) and `wrangler deploy --env <env>` right away.
#   3. Check: https://<dapp host>/_version, /service-worker.js returns the
#      SW kill switch, the old manage host 302s to the dapp host, and a
#      browser that had the legacy dapp installed reloads into this app.
# Rollback: comment the blocks again and deploy; re-add the route in the
# legacy worker and deploy it (it serves a kill switch for this app's /sw.js).

# ─── ROC (dapp.rifonchain.com) ───────────────────────────────────────────────
[env.roc]
name = "dapp-proxy-roc"

[env.roc.vars]
PINATA_GATEWAY = "https://rifonchain.mypinata.cloud"

[[env.roc.kv_namespaces]]
binding = "DAPP_KV"
id = "a4e86b88ef684d06912dcb5eefe098a4"

[[env.roc.routes]]
pattern = "dapp.rifonchain.com/*"
zone_name = "rifonchain.com"

# ─── Flipmoney (dapp.flipmoney.io) ───────────────────────────────────────────
[env.flipmoney]
name = "dapp-proxy-flipmoney"

[env.flipmoney.vars]
PINATA_GATEWAY = "https://flipmoney.mypinata.cloud"

[[env.flipmoney.kv_namespaces]]
binding = "DAPP_KV"
id = "19c9b65254c7457aa90067abac0ee0c0"

[[env.flipmoney.routes]]
pattern = "dapp.flipmoney.io/*"
zone_name = "flipmoney.io"

# ─── Money on Chain / moc-v1 (manage.moneyonchain.com → dapp.moneyonchain.com) ───────────────────────
[env.moc]
name = "dapp-proxy-moc"

[env.moc.vars]
PINATA_GATEWAY = "https://moneyonchain.mypinata.cloud"
# CUTOVER: uncomment to redirect manage.moneyonchain.com to dapp.moneyonchain.com
# (see MIGRATION note at the top).
CANONICAL_HOST = "dapp.moneyonchain.com"

[[env.moc.kv_namespaces]]
binding = "DAPP_KV"
id = "c86625e5a1f543a89017c69c26afc76f"

[[env.moc.routes]]
pattern = "manage.moneyonchain.com/*"
zone_name = "moneyonchain.com"

# CUTOVER: uncomment once the route has been removed from the legacy dapp's
# worker (stable-protocol-interface, env moc) — a route can only belong to one worker.
[[env.moc.routes]]
pattern = "dapp.moneyonchain.com/*"
zone_name = "moneyonchain.com"

# ─── ROC Testnet (dapp-testnet.rifonchain.com) ───────────────────────────────
[env.roc-testnet]
name = "dapp-proxy-roc-testnet"

[env.roc-testnet.vars]
PINATA_GATEWAY = "https://rifonchain.mypinata.cloud"

[[env.roc-testnet.kv_namespaces]]
binding = "DAPP_KV"
id = "22ea181286944002acebe5252e3fadc5"

[[env.roc-testnet.routes]]
pattern = "dapp-testnet.rifonchain.com/*"
zone_name = "rifonchain.com"

# ─── Flipmoney Testnet (dapp-testnet.flipmoney.io) ───────────────────────────
[env.flipmoney-testnet]
name = "dapp-proxy-flipmoney-testnet"

[env.flipmoney-testnet.vars]
PINATA_GATEWAY = "https://flipmoney.mypinata.cloud"

[[env.flipmoney-testnet.kv_namespaces]]
binding = "DAPP_KV"
id = "6570d69ffa304e2d8eed32d83969b392"

[[env.flipmoney-testnet.routes]]
pattern = "dapp-testnet.flipmoney.io/*"
zone_name = "flipmoney.io"

# ─── Money on Chain / moc-v1 Testnet (manage-testnet → dapp-testnet.moneyonchain.com) ───────
[env.moc-testnet]
name = "dapp-proxy-moc-testnet"

[env.moc-testnet.vars]
PINATA_GATEWAY = "https://moneyonchain.mypinata.cloud"
# CUTOVER: uncomment to redirect manage-testnet.moneyonchain.com to dapp-testnet.moneyonchain.com
# (see MIGRATION note at the top).
CANONICAL_HOST = "dapp-testnet.moneyonchain.com"

[[env.moc-testnet.kv_namespaces]]
binding = "DAPP_KV"
id = "318db92ab6b9477bab82d72774b1df7f"

[[env.moc-testnet.routes]]
pattern = "manage-testnet.moneyonchain.com/*"
zone_name = "moneyonchain.com"

# CUTOVER: uncomment once the route has been removed from the legacy dapp's
# worker (stable-protocol-interface, env moc-testnet) — a route can only belong to one worker.
[[env.moc-testnet.routes]]
pattern = "dapp-testnet.moneyonchain.com/*"
zone_name = "moneyonchain.com"
